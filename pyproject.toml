[project]
name = "nominal-checks-from-jama"
version = "0.2.0"
description = "Make Nominal checks from the requirements in a Jama Connect project"
authors = [{ name = "Nominal, Inc." }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11,<4"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    # _nominal.py reaches the checklist service through the client's private handles,
    # so the range covers only releases it has been tested with.
    "nominal>=1.180.1,<1.181",
    "nominal-api",
    "click>=8.1,<9",
    "keyring>=25,<26",
    "tomli-w>=1.0,<2",
]

[project.scripts]
nominal-checks-from-jama = "nominal_checks_from_jama.cli:main"

[project.urls]
Homepage = "https://nominal.io"
Repository = "https://github.com/nominal-io/nominal-jama-connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nominal_checks_from_jama"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.dependency-groups]
# nominal-sphinx-theme needs 3.12; the package itself supports 3.11
docs = { requires-python = ">=3.12" }

[tool.uv.sources]
# github.com/nominal-io/nominal-sphinx-theme. `just build-docs` uses its newest commit, and falls
# back to the commit in uv.lock if that build fails. To move uv.lock:
# `uv lock --upgrade-package nominal-sphinx-theme`
nominal-sphinx-theme = { git = "https://github.com/nominal-io/nominal-sphinx-theme" }

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
    "respx>=0.22.0,<0.23",
    "ruff==0.12.1",
]
docs = [
    # Sphinx 11 removes APIs that MyST still uses.
    "sphinx>=9.1,<11",
    "myst-parser>=4",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    # the CLI reference, from the commands' docstrings
    "sphinx-click>=6",
    "nominal-sphinx-theme",
]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "docs/conf.py", "docs/_ext/*.py", "nominal-checks-from-jama.py"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["nominal_checks_from_jama"]

[tool.ruff.lint]
# See rules and codes: https://docs.astral.sh/ruff/rules/
select = [
    "F",    # pyFlakes
    "E",    # pycodestyle (Err)
    "W",    # pycodestyle (Warn)
    "D",    # pyDocstyle
    "I001", # Isort
    "FIX",  # Flake8-FIXme
    "PL",   # PyLinT
    "T100", # debugger
]
extend-select = [
    "D417", # no missing arguments
]
ignore = [
    "D100",    # missing-module-docstring
    "D104",    # missing-package-docstring
    "D105",    # missing-magic-method-docstring
    "D107",    # missing-init-docstring: classes document construction in their own docstring
    "D203",    # one-blank-line-before-class
    "D205",    # 1 blank line between summary and description
    "D213",    # multiline-summary-docs
    "D400",    # doc line ends in period
    "D401",    # imperative mood
    "D415",    # doc line ends in punctuation
    "FIX002",  # Ignore TODOs
    "PLC0415", # import should be at top-level: the Nominal client is imported only when it's used
    "PLR0913", # too many arguments
    "PLR2004", # magic values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "nominal-checks-from-jama.py"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
addopts = "--cov=nominal_checks_from_jama --cov-branch --cov-report=term"
